stages:
  - test
  - build

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

test:
  stage: test
  image: rust:1-bookworm
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends docker.io openssh-client
    - rustup component add clippy
  script:
    - cargo clippy --all-targets -- -D warnings
    - cargo test --locked
    - DCD_E2E=1 cargo test --locked --test e2e -- --test-threads=1
    - DCD_E2E=1 cargo test --locked --test ssh_shells -- --test-threads=1
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - target/

# Static musl binary — one file, no runtime deps on the target server beyond docker.
build:
  stage: build
  image: messense/rust-musl-cross:x86_64-musl
  script:
    - cargo build --release --locked --target x86_64-unknown-linux-musl
    - cp target/x86_64-unknown-linux-musl/release/dcd dcd
    - strip dcd || true
    - ./dcd version
  artifacts:
    name: dcd-$CI_COMMIT_SHORT_SHA
    paths:
      - dcd
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'
