# dcd cutover target. dcd writes nginx-upstream.conf (`set $backend "<release>:8080";`)
# and reloads this nginx; $backend forces runtime DNS resolution via Docker's resolver.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    include /etc/nginx/upstream/nginx-upstream.conf;

    client_max_body_size 1024M;

    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # host nginx sets this to $scheme
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    }

    # Served before the first cutover (fallback backend fails fast) or if the release is down.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
