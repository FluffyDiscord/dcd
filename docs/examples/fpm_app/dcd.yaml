# A PHP-FPM app, deployed red-black with dcd, prod + beta on one host.
#
# The release image is nginx + php-fpm under supervisord, serving HTTP on :8080 (see
# app-image/ for that side of the picture). dcd creates the new release beside the live one,
# health-checks it THROUGH the router, then flips the router's upstream to it.
#
# Each stage pins `project` explicitly: prod -> "webapp", beta -> "beta-webapp". That name
# drives every container ({project}-*) and COMPOSE_PROJECT_NAME, so prod and beta run
# side-by-side on one host. It is pinned rather than derived from the deploy_root folder name
# so the two stages namespace apart even when their paths differ.
#
# Containers themselves live in docker-compose.prod.yml — images, volumes, env, restart
# policies and healthchecks. Only the orchestration is here; see ../all_in_one/dcd.yaml for
# the full field reference.

version: 2

ssh: ${DEPLOY_SSH}
deploy_root: ${DEPLOY_ROOT}

compose:
  files:
    - docker-compose.prod.yml
  env:
    ROUTER_PORT: '8080'
    # dcd injects COMPOSE_PROJECT_NAME=<project> automatically, and passes the whole
    # resolved dotenv chain, so REGISTRY/APP_TAG/ROUTER_TAG/DEPLOY_ROOT are not re-listed.

directories:
  - path: data/mysql
  - path: data/meili
  - path: data/uploads
    owner: '1000:1000'
  - path: data/private
    owner: '1000:1000'
  - path: data/log
    owner: '1000:1000'

release:
  service: app
  container_prefix: '{project}-app'
  # The app image has no probe binary of its own, so the check runs from the router and
  # targets the new container by name — never the alias, which still resolves to the old one.
  healthcheck:
    exec_in: router
    cmd: 'curl -sf http://{container}:8080/health'
  migrate:
    before: 'php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration'
  drain: 'sh /app/docker/prod/drain.sh'

cutover:
  service: router
  backend_port: 8080
  fallback_backend: '127.0.0.1:9'
  validate: { exec_in: router, cmd: 'nginx -t' }
  reload: { exec_in: router, cmd: 'nginx -s reload' }

# Policy only — names, images and readiness come from the compose file.
services:
  router: {}                    # recreated on image change (the default); its compose
                                # healthcheck is the readiness gate
  mariadb: {}
  meilisearch:
    recreate: never
  scheduler: {}

stages:
  # deploy_root comes from $DEPLOY_ROOT (CI sets it per job). `project` is pinned per stage,
  # so prod and beta namespace apart on one host. beta only needs its own router port behind
  # the system nginx.
  prod:
    project: webapp
    compose:
      env:
        SCHEDULER_ENABLED: '1'   # prod runs the scheduler loop; beta leaves it unset -> idles
  beta:
    project: beta-webapp
    compose:
      files:
        - docker-compose.beta.yml
      env:
        ROUTER_PORT: '8081'
        MAILPIT_UI_PORT: '8025'
    services:
      # mailpit is defined in the appended docker-compose.beta.yml. Declaring it here merges
      # into the base services map for the beta stage only, so dcd starts and re-asserts it
      # across deploys.
      mailpit:
        recreate: never
