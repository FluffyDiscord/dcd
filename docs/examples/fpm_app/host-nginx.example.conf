# Host (system) nginx — TLS terminator in front of the dcd router container.
# Copy to /etc/nginx/sites-available/webapp.conf, adjust the server_name + cert paths, enable, reload.
# REQUIRED: it must set X-Forwarded-Proto to $scheme so the app (behind it) detects HTTPS correctly
# (cookie_secure: auto, Request::isSecure, generated URLs). Without it: login loops / insecure cookies.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

# prod -> the "webapp" router (ROUTER_PORT 8080)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 1024M;

    location / {
        proxy_pass http://127.0.0.1:8080;      # the prod dcd router container
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # REQUIRED — see note above
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}

# beta -> the "beta-webapp" router (ROUTER_PORT 8081); same box, distinct project/network/port.
# Install the :80 server FIRST; run certbot --nginx after DNS points here, and it injects the 443
# server (nginx will not load a 443 ssl server before the cert files exist).
server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;
    location / { return 301 https://$host$request_uri; }   # certbot manages the ACME challenge ahead of this
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.example.com;

    ssl_certificate     /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;

    client_max_body_size 1024M;

    # Mailpit web UI (beta only) — HTTP Basic in front of the catch-all mailbox.
    location = /mailpit { return 301 /mailpit/; }   # bare path -> trailing-slash form
    location /mailpit/ {
        auth_basic           "Mailpit (beta)";
        auth_basic_user_file /etc/nginx/.beta-mailpit.htpasswd;
        proxy_pass http://127.0.0.1:8025;          # NO trailing slash: MP_WEBROOT=mailpit serves under /mailpit/
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # mailpit live message stream = websocket
        proxy_set_header Connection        "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;      # the beta dcd router container
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
