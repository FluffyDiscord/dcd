; The release image runs php-fpm + nginx under supervisord, serving HTTP on :8080.
; This is what makes it an "FPM" release (vs. an app that is itself the HTTP server, like RoadRunner
; or FrankenPHP): nginx handles static files and speaks FastCGI to php-fpm on 127.0.0.1:9000.
;
; supervisorctl over the unix socket is how dcd's release.drain (drain.sh) stops the two programs
; gracefully before the old container is removed.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autorestart=true
stopsignal=QUIT
stopwaitsecs=35
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
