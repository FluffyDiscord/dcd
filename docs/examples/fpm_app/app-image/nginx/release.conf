# The release nginx (inside the app image), listening on :8080. dcd's router proxies here after
# cutover; dcd's healthcheck curls http://{container}:8080/health through the router.
server {
    listen 8080;
    server_name _;
    root /app/public;

    # Liveness probe for the dcd cutover: hits fpm but not the framework (no kernel, no DB).
    # Exact-match location wins over the regex php blocks regardless of order.
    location = /health {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Static, no PHP fallback (baked assets + persisted uploads).
    location /build   { try_files $uri =404; }
    location /bundles { try_files $uri =404; }
    location /uploads { try_files $uri =404; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
