[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; On drain, supervisord sends QUIT (graceful) and waits stopwaitsecs=35 before SIGKILL — that
; bounds how long active requests have to finish; no global process_control_timeout needed here.
