# Every container in the deploy, including the red-black app itself: under dcd v2 this file
# is the single source for container definition, and dcd.yaml carries only orchestration.
# Paths are relative to this file's dir (= $DEPLOY_ROOT).
# COMPOSE_PROJECT_NAME / REGISTRY / APP_TAG / ROUTER_TAG / ROUTER_PORT arrive through the
# compose process environment (dcd passes the resolved dotenv chain; it writes no env file),
# so every name namespaces per stage and prod + beta coexist on one host.
#
# Conventions:
#   - `app` carries `profiles: ["dcd-release"]` so a hand-run `docker compose up` never starts
#     a second copy beside the release dcd is deploying. dcd creates it with `compose run`.
#   - Every service dcd manages declares a `healthcheck:` — dcd requires one, because
#     `compose up --wait` would otherwise gate on "started" rather than "ready".
#   - app + router come from the CI registry (${REGISTRY}:<tag>) — never built on the server.
#   - mariadb + meilisearch are stock images pinned to exact stable versions.
#   - Nothing is published publicly: only the router binds a port, on 127.0.0.1 (the host nginx
#     terminates TLS and proxies to it); all other services talk over the private default network.
#   - Secrets reach these side containers only via env_file (Docker env-file format) — never via
#     the compose.env map. (The red-black app can instead use dcd's dotenv chain, which leaves
#     nothing at rest — this setup keeps the operator-managed files.)

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_default
    external: true

services:
  # The red-black release. dcd creates one container per release from this definition and
  # never lets `compose up` touch it.
  app:
    image: ${REGISTRY}:${APP_TAG}
    profiles: ["dcd-release"]
    restart: unless-stopped
    env_file:
      - .env.deploy.app
    environment:
      TZ: UTC
      APP_ENV: prod
    networks:
      default:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-app
    volumes:
      - ./data/uploads:/app/public/uploads
      - ./data/private:/app/private
      - ./data/log:/app/var/log

  router:
    image: ${REGISTRY}:${ROUTER_TAG:-router-latest}
    container_name: ${COMPOSE_PROJECT_NAME}-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ROUTER_PORT}:80"
    healthcheck:
      test: ["CMD", "test", "-f", "/var/run/nginx.pid"]
      interval: 1s
      retries: 30
    volumes:
      # dcd writes this file on the target; only this mount puts it inside the router.
      - ./nginx-upstream.conf:/etc/nginx/upstream/nginx-upstream.conf:ro

  mariadb:
    image: mariadb:10.6.22
    container_name: ${COMPOSE_PROJECT_NAME}-mariadb
    restart: unless-stopped
    env_file:
      - .env.deploy.infra
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "--silent"]
      interval: 1s
      retries: 60
    volumes:
      - ./data/mysql:/var/lib/mysql

  meilisearch:
    image: getmeili/meilisearch:v1.35.0
    container_name: ${COMPOSE_PROJECT_NAME}-meilisearch
    restart: unless-stopped
    env_file:
      - .env.deploy.infra
    environment:
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 1s
      retries: 30
    volumes:
      - ./data/meili:/meili_data

  scheduler:
    image: ${REGISTRY}:${APP_TAG}
    container_name: ${COMPOSE_PROJECT_NAME}-scheduler
    restart: unless-stopped
    init: true
    command:
      - sh
      - /app/docker/prod/scheduler.sh
    env_file:
      - .env.deploy.app
    environment:
      TZ: UTC
      APP_ENV: prod
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-0}   # prod sets 1 (dcd stages.prod); beta defaults 0 -> idles
    healthcheck:
      test: ["CMD", "pgrep", "-f", "scheduler.sh"]
      interval: 1s
      retries: 10
    volumes:
      - ./data/uploads:/app/public/uploads
      - ./data/private:/app/private
      - ./data/log:/app/var/log
