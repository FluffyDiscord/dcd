# A hand-rolled red-black deploy script, as a dcd config.
#
# dcd runs on the DEPLOYING machine (a CI runner or a workstation) and reaches the
# server over SSH. Nothing is pre-staged there: the compose file travels from this
# checkout, and dcd owns only dcd-state.json, the upstream file and the image
# override on the server.
#
# Containers are declared where they belong — in docker-compose.prod.yml. What is
# left here is orchestration policy: which service is cut over to, how it is
# health-gated, how traffic switches, migrations, drain, worker discovery, and the
# recreate policy compose cannot express.
#
# CI exports REGISTRY / APP_TAG / DEPLOY_ROOT / DEPLOY_SSH / MAXMIND_*; the whole
# resolved dotenv chain is passed to compose automatically, so nothing is re-listed.
# See ../all_in_one/dcd.yaml for every field and its default.

version: 2
project: acme

ssh: ${DEPLOY_SSH}          # e.g. deploy@prod.example.internal, or an ~/.ssh/config Host alias
deploy_root: ${DEPLOY_ROOT} # where dcd works ON THE SERVER

compose:
  files: [docker-compose.prod.yml]   # uploaded to deploy_root at the start of every deploy

# Created (and chowned) on the server before the deploy runs.
directories:
  - { path: .docker/logs/symfony, owner: '1000:1000' }
  - { path: .docker/valkey/data }
  - { path: .docker/centrifugo }

# The app — a compose service, started red-black and cut over to.
release:
  service: app
  container_prefix: acme-app-rr
  healthcheck:                       # escape-hatch form: this image has no probe binary,
    exec_in: nginx                   # so the probe runs from nginx against {container}
    cmd: 'curl -sf http://{container}:2114/health?plugin=http'
  migrate:
    before: 'php bin/console app:db:migrate before --no-interaction'
    after: 'php bin/console app:db:migrate after --no-interaction'
  drain: 'bin/graceful-stop.sh'

# Point nginx at the new container (writes the upstream file, reloads).
cutover:
  service: nginx
  backend_port: 8080
  reload: { exec_in: nginx, cmd: 'nginx -s reload' }

# Policy only — names, images and readiness come from docker-compose.prod.yml.
services:
  postgres: { on_recreate_drain_workers: true }
  valkey: { recreate: never }

# Worker names come from the running app; dcd runs one container per name from the
# `worker` compose service.
workers:
  service: worker
  provider:
    command_in_release: 'php bin/console app:worker:list --no-ansi --env=prod'
  drain: 'php bin/console messenger:stop-workers --env=prod'

# Generate centrifugo's config from the freshly-healthy app, copy it out, (re)start it.
hooks:
  after_healthcheck:
    - exec_in_release: 'php bin/console app:realtime:config --output=/tmp/centrifugo-config.json --no-interaction --env=prod'
    - cp_from_release: { from: /tmp/centrifugo-config.json, to: .docker/centrifugo/config.json }
    - compose: ['up', '-d', 'centrifugo']

stages:
  prod:
    host: prod.example.internal   # dcd refuses to run unless the TARGET's hostname matches
