[package]
name = "dcd"
version = "0.5.3"
edition = "2021"
# `File::try_lock`/`unlock` (the stage mutex) are std as of 1.89, which retired the
# last unmaintained dependency (fs2, last released 2018). Declared so a toolchain
# that predates them says so instead of failing on a missing method.
rust-version = "1.89"
description = "Zero-downtime red-black Docker deploys from a YAML config, extensible via Lua."
license = "MIT"

[[bin]]
name = "dcd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml was deprecated and archived by its author in 2024, and so was the
# unsafe-libyaml it parses with. serde_norway is the fork that kept both alive —
# same API, same `Value`/`Mapping`, so config semantics do not move.
serde_norway = "0.9"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
signal-hook = "0.4"
gethostname = "1"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
regex-lite = "0.1.9"
schemars = { version = "1.2.2", features = ["indexmap2"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
