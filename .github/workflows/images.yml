name: images

# A version tag publishes an immutable `{{version}}`. A master push publishes `latest`,
# which tracks the branch and is not a release.
on:
  push:
    branches: ['master']
    tags: ['v*']
  workflow_dispatch:

jobs:
  binary:
    name: binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Built inside Alpine so the musl target is native for this architecture. The
      # container is driven from the host because Alpine cannot host JS actions on arm64.
      - name: Build and test the static binary
        run: |
          docker run --rm -v "$PWD":/build -w /build rust:1-alpine sh -eu -c '
            apk add --no-cache musl-dev build-base
            cargo build --release --locked
            cargo test --locked
            ./target/release/dcd --version
          '

      - uses: actions/upload-artifact@v4
        with:
          name: dcd-${{ matrix.arch }}
          path: target/release/dcd
          if-no-files-found: error
          retention-days: 1

  images:
    name: image (${{ matrix.flavor }})
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: debian
            base: debian:stable-slim
            suffix: ''
          - flavor: alpine
            base: alpine:3
            suffix: '-alpine'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dcd-*
          path: artifacts

      - name: Lay out the per-architecture binaries
        run: |
          mkdir -p dist/amd64 dist/arm64
          install -m 0755 artifacts/dcd-amd64/dcd dist/amd64/dcd
          install -m 0755 artifacts/dcd-arm64/dcd dist/arm64/dcd

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=false` keeps metadata-action from attaching `latest` to a semver tag:
          # `latest` is produced by a master push alone, never by a tag push, so re-pushing
          # an old version tag cannot repoint it. `{{major}}.{{minor}}` stays gone.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BASE_IMAGE=${{ matrix.base }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
